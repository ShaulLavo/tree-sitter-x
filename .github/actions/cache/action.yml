name: Cache

description: This action caches fixtures

outputs:
  cache-hit:
    description: Cache hit
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      id: cache
      with:
        path: |
          test/fixtures/grammars
        key: fixtures-${{ hashFiles(
          'crates/generate/src/**',
          'crates/xtask/src/generate.rs',
          'lib/src/parser.h',
          'lib/src/array.h',
          'lib/src/alloc.h',
          'lib/src/wasm-stdlib/external_scanner_stdlib.h',
          'crates/loader/wasi-sdk-version',
          'crates/loader/binaryen-version',
          'test/fixtures/fixtures.json',
          '.github/actions/cache/action.yml') }}
