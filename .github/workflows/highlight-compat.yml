name: Highlight compatibility

on:
  pull_request:
    branches: [master]
    paths:
      - 'test/highlight-compat/**'
      - 'lib/**'
      - 'crates/xtask/**'
      - 'crates/loader/**'
      - 'Cargo.*'
      - '.github/workflows/highlight-compat.yml'
  push:
    branches: [master]
    paths:
      - 'test/highlight-compat/**'
      - 'lib/**'
      - 'crates/xtask/**'
      - 'crates/loader/**'
      - 'Cargo.*'
      - '.github/workflows/highlight-compat.yml'

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLATFORM_ROOT: /nonexistent/highlight-compat-platform
    defaults:
      run:
        working-directory: test/highlight-compat
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.12.1
          cache: npm
          cache-dependency-path: |
            test/highlight-compat/package-lock.json
            lib/binding_web/package-lock.json

      - name: Set up pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.98.1

      - name: Build checkout web binding and scope component
        working-directory: .
        run: |
          cargo xtask build-wasm
          cargo xtask build-scope-compat
          cd lib/binding_web
          npm ci
          npm run build:ts

      - name: Share the built task runner with native safety checks
        uses: actions/upload-artifact@v7
        with:
          name: scope-compat-xtask
          path: target/debug/xtask
          retention-days: 1

      - name: Install dependencies
        run: npm ci

      - name: Check tracked imports
        run: node scripts/check-tracked-imports.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: Check reference golden and report staleness
        run: npm run artifacts:check

      - name: Check current Markdown assets and native pilot report
        run: npm run report:native -- --check

      - name: Check tests left the checkout unchanged
        if: always()
        run: node scripts/check-tracked-imports.mjs --check-clean

  scope-compat-native:
    needs: harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8
        with:
          name: scope-compat-xtask
          path: target/debug
      - name: Fetch native JSON grammar
        run: |
          chmod +x target/debug/xtask
          target/debug/xtask fetch-fixtures
      - name: Run native scope sanitizers
        run: target/debug/xtask build-scope-compat --native-test
