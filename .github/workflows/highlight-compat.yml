name: Highlight compatibility

on:
  pull_request:
    branches: [master]
    paths:
      - 'test/highlight-compat/**'
      - 'lib/**'
      - 'crates/xtask/**'
      - 'crates/loader/**'
      - 'Cargo.*'
      - '.github/workflows/highlight-compat.yml'
  push:
    branches: [master]
    paths:
      - 'test/highlight-compat/**'
      - 'lib/**'
      - 'crates/xtask/**'
      - 'crates/loader/**'
      - 'Cargo.*'
      - '.github/workflows/highlight-compat.yml'

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLATFORM_ROOT: /nonexistent/highlight-compat-platform
    defaults:
      run:
        working-directory: test/highlight-compat
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: |
            test/highlight-compat/package-lock.json
            lib/binding_web/package-lock.json

      - name: Set up pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.98.1

      - name: Build checkout web binding
        working-directory: .
        run: |
          cargo xtask build-wasm
          cd lib/binding_web
          npm ci
          npm run build:ts

      - name: Install dependencies
        run: npm ci

      - name: Prove review regressions fail without their fixes
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process'
          import { readFileSync, writeFileSync } from 'node:fs'

          function negative(path, change, tests, signature) {
            const original = readFileSync(path, 'utf8')
            const modified = change(original)
            if (modified === original) throw new Error(`regression mutation did not change ${path}`)
            writeFileSync(path, modified)
            try {
              const result = spawnSync(process.execPath, ['node_modules/vitest/vitest.mjs', 'run', ...tests], { encoding: 'utf8', maxBuffer: 8 * 1024 * 1024 })
              const output = result.stdout + result.stderr
              process.stdout.write(output)
              if (result.status !== 1 || !output.includes(signature)) throw new Error(`expected regression was not observed for ${path}`)
              console.log(`PRE-FIX REGRESSION CONFIRMED: ${path}`)
            } finally {
              writeFileSync(path, original)
            }
          }

          negative('src/artifacts.ts', source => source
            .replace("  const status = lstatSync(root, { throwIfNoEntry: false })\n  if (status === undefined) return []\n  if (!status.isDirectory()) throw new Error(`unsupported artifact entry: ${root}`)", '  if (!existsSync(root)) return []')
            .replace('    else throw new Error(`unsupported artifact entry: ${path}`)\n', ''),
          ['tests/artifacts.test.ts'], 'AssertionError')

          negative('src/regeneration.ts', source => source.replace("  await steps.generate(first)\n  const counts = steps.selfTests(join(first, 'goldens'))", "  const counts = steps.selfTests(join(first, 'goldens'))\n  await steps.generate(first)"),
          ['tests/regeneration.test.ts', '-t', 'mandatory checks|after a theme change'], 'ENOENT')

          negative('src/regeneration.ts', source => source.slice(0, source.indexOf('export function publishArtifacts')) + `export function publishArtifacts(generated: string, root: string, operations: PublicationOperations = {}): void {
            const copy = operations.copy ?? cpSync
            for (const directory of ['goldens', 'reports']) {
              rmSync(join(root, directory), { recursive: true, force: true })
              copy(join(generated, directory), join(root, directory), { recursive: true })
            }
          }
          `, ['tests/regeneration.test.ts', '-t', 'publication fails'], 'AssertionError')

          negative('../../.github/workflows/highlight-compat.yml', source => source.replace('toolchain: 1.98.1', 'toolchain: stable'),
          ['tests/runtime-pins.test.ts', '-t', 'Rust release'], 'AssertionError')

          negative('src/oracles/run.ts', source => source
            .replace("    worker.once('error', (error: unknown) => {\n      const failure: Settled = { status: 'error', diagnostic: `oracle worker failed: ${messageOf(error)}` }\n      if (outcome?.status === 'complete') outcome = failure\n      else settle(failure)\n    })", "    worker.once('error', (error: unknown) => settle({ status: 'error', diagnostic: `oracle worker failed: ${messageOf(error)}` }))")
            .replace("      if (code !== 0 && outcome?.status === 'complete') outcome = { status: 'error', diagnostic: `oracle worker exited with code ${code} after answering` }\n", ''),
          ['tests/oracle-core.test.ts', '-t', 'rejects worker failures after an answer'], 'AssertionError')
          NODE

      - name: Check tracked imports
        run: node scripts/check-tracked-imports.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: Regenerate gate evidence from executed self-tests
        run: npm run artifacts:update

      - name: Upload generated gate evidence
        uses: actions/upload-artifact@v7.0.0
        with:
          name: highlight-compat-gate
          path: test/highlight-compat/reports/phase-1-gate.md
          if-no-files-found: error
          retention-days: 7

      - name: Stress ten complete pinned-runtime regenerations
        run: |
          for iteration in $(seq 1 10); do
            echo "POST-FIX REGENERATION $iteration START"
            node scripts/regenerate.ts --check
            echo "POST-FIX REGENERATION $iteration PASS"
          done

      - name: Check reference golden and report staleness
        run: npm run artifacts:check

      - name: Check tests left the checkout unchanged
        if: always()
        run: node scripts/check-tracked-imports.mjs --check-clean
