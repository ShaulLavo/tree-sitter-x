name: Sanitize

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

on:
  workflow_call:

jobs:
  check-undefined-behaviour:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TREE_SITTER: ${{ github.workspace }}/target/release/tree-sitter
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install UBSAN library
        run: sudo apt-get update -y && sudo apt-get install -y libubsan1

      - name: Test native array assignment with UBSAN
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -g -Ilib/include test/array_test.c lib/src/alloc.c -o "$RUNNER_TEMP/array-test"
          UBSAN_OPTIONS=halt_on_error=1 "$RUNNER_TEMP/array-test"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2

      - name: Build project
        run: cargo build --release

      - name: Fetch fixtures
        run: cargo xtask fetch-fixtures

      - name: Generate fixtures
        run: cargo xtask generate-fixtures

      - name: Run main tests with undefined behaviour sanitizer (UBSAN)
        run: cargo test -- --test-threads 1
        env:
          CFLAGS: -fsanitize=undefined
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -lubsan

      - name: Run main tests with address sanitizer (ASAN)
        run: cargo test -- --test-threads 1
        env:
          ASAN_OPTIONS: verify_asan_link_order=0
          CFLAGS: -fsanitize=address
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -lasan --cfg sanitizing
