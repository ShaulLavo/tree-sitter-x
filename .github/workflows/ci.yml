name: CI

on:
  push:
    branches:
      - 'master'
      - 'release-[0-9]+.[0-9]+'
  pull_request:
    branches:
      - 'master'
      - 'release-[0-9]+.[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.paths.outputs.native }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Test native CI path filter
        run: python3 .github/scripts/test-native-ci-paths.py

      - name: Check native CI inputs
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == push ]]; then
            echo 'native=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Both names of a rename matter when a file moves into or out of native inputs.
          native=$(git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" |
            bash .github/scripts/native-ci-paths.sh)
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "Native CI inputs changed: $native" >> "$GITHUB_STEP_SUMMARY"

  checks:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Lint Rust files
        run: make lint

      - name: Install Taplo
        uses: taiki-e/install-action@v2
        with:
          tool: taplo@0.10.0

      - name: Lint TOML files
        run: make lint-toml

      - name: Lint web files
        run: make lint-web

  sanitize:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/sanitize.yml

  build:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/build.yml

  check-wasm-stdlib:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/wasm_stdlib.yml

  native-ci:
    if: always()
    needs: [changes, checks, sanitize, build, check-wasm-stdlib]
    runs-on: ubuntu-latest
    steps:
      - name: Check native CI results
        env:
          CHANGES: ${{ needs.changes.result }}
          NATIVE: ${{ needs.changes.outputs.native }}
          CHECKS: ${{ needs.checks.result }}
          SANITIZE: ${{ needs.sanitize.result }}
          BUILD: ${{ needs.build.result }}
          WASM_STDLIB: ${{ needs.check-wasm-stdlib.result }}
        run: |
          [[ "$CHANGES" == success ]] || exit 1
          expected=success
          [[ "$NATIVE" == true ]] || expected=skipped
          for result in "$CHECKS" "$SANITIZE" "$BUILD" "$WASM_STDLIB"; do
            [[ "$result" == "$expected" ]] || exit 1
          done
