name: CI

on:
  push:
    branches:
      - 'master'
      - 'release-[0-9]+.[0-9]+'
    paths:
      - '.cargo/**'
      - '.github/**'
      - 'crates/**'
      - 'lib/**'
      - 'test/**'
      - '.editorconfig'
      - '.envrc'
      - '.gitattributes'
      - '.gitignore'
      - '.taplo.toml'
      - 'CMakeLists.txt'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'FUNDING.json'
      - 'LICENSE'
      - 'Makefile'
      - 'build.zig'
      - 'build.zig.zon'
      - 'flake.lock'
      - 'flake.nix'
  pull_request:
    branches:
      - 'master'
      - 'release-[0-9]+.[0-9]+'
    paths:
      - '.cargo/**'
      - '.github/**'
      - 'crates/**'
      - 'lib/**'
      - 'test/**'
      - '.editorconfig'
      - '.envrc'
      - '.gitattributes'
      - '.gitignore'
      - '.taplo.toml'
      - 'CMakeLists.txt'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'FUNDING.json'
      - 'LICENSE'
      - 'Makefile'
      - 'build.zig'
      - 'build.zig.zon'
      - 'flake.lock'
      - 'flake.nix'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Lint Rust files
        run: make lint

      - name: Install Taplo
        uses: taiki-e/install-action@v2
        with:
          tool: taplo@0.10.0

      - name: Lint TOML files
        run: make lint-toml

      - name: Lint web files
        run: make lint-web

  sanitize:
    uses: ./.github/workflows/sanitize.yml

  build:
    uses: ./.github/workflows/build.yml

  check-wasm-stdlib:
    uses: ./.github/workflows/wasm_stdlib.yml
