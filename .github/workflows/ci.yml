name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
      - 'release-[0-9]+.[0-9]+'
    paths:
      - '.cargo/**'
      - '.github/**'
      - 'crates/**'
      - 'scripts/**'
      - 'xtask/**'
      - 'lib/**'
      - 'test/**'
      - '**.toml'
      - 'docs/src/assets/js/playground.js'
      - '.editorconfig'
      - '.envrc'
      - '.gitattributes'
      - '.gitignore'
      - '.taplo.toml'
      - 'CMakeLists.txt'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'FUNDING.json'
      - 'LICENSE'
      - 'Makefile'
      - 'build.zig'
      - 'build.zig.zon'
      - 'flake.lock'
      - 'flake.nix'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - 'master'
      - 'release-[0-9]+.[0-9]+'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.paths.outputs.native }}
      bindgen: ${{ steps.extra-paths.outputs.bindgen }}
      wasm-exports: ${{ steps.extra-paths.outputs.wasm-exports }}
      package-types: ${{ steps.extra-paths.outputs.package-types }}
      highlight-compat: ${{ steps.extra-paths.outputs.highlight-compat }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test native CI path filter
        run: python3 .github/scripts/test-native-ci-paths.py

      - name: Check native CI inputs
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == push || "$EVENT_NAME" == workflow_dispatch ]]; then
            echo 'native=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Both names of a rename matter when a file moves into or out of native inputs.
          native=$(git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" |
            bash .github/scripts/native-ci-paths.sh)
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "Native CI inputs changed: $native" >> "$GITHUB_STEP_SUMMARY"

      - uses: dorny/paths-filter@v3
        id: extra-paths
        with:
          base: ${{ github.ref }}
          filters: |
            bindgen:
              - 'lib/include/tree_sitter/api.h'
              - 'lib/binding_rust/bindings.rs'
              - 'lib/src/*.def'
              - 'crates/xtask/src/generate.rs'
              - '.github/**'
            wasm-exports:
              - 'lib/include/tree_sitter/api.h'
              - 'lib/binding_rust/bindings.rs'
              - 'lib/binding_web/**'
              - 'xtask/src/**'
              - 'crates/xtask/src/**'
              - 'CMakeLists.txt'
              - '.github/**'
            package-types:
              - 'lib/binding_web/**'
              - '.github/**'
            highlight-compat:
              - 'test/highlight-compat/**'
              - 'lib/**'
              - 'crates/xtask/**'
              - 'crates/loader/**'
              - 'Cargo.*'
              - '.github/**'

  checks:
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.changes.outputs.native == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Set up pinned nightly Rust toolchain
        run: rustup toolchain install nightly-2026-09-03 --profile minimal --component rustfmt,clippy

      - uses: ./.github/actions/rust-build-cache

      - name: Lint Rust files
        run: bash scripts/with-build-cache.sh make lint

      - name: Check formatting with nightly rustfmt
        run: cargo +nightly-2026-09-03 fmt --all --check

      - name: Lint Rust files with nightly clippy
        run: bash scripts/with-build-cache.sh cargo +nightly-2026-09-03 clippy --workspace --all-targets -- -D warnings

      - name: Install Taplo
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: taplo@0.10.0

      - name: Lint TOML files
        run: make lint-toml

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: lib/binding_web/package-lock.json

      - name: Lint web files
        run: make lint-web

  consistency:
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.changes.outputs.native == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable

      # rustdoc's JSON output is nightly-only and unstable
      - name: Set up pinned nightly Rust toolchain
        run: rustup toolchain install nightly-2026-09-03 --profile minimal

      - name: Check regex error kinds
        run: cargo xtask check-regex-error-kinds

      - name: Check Wasm stdlib
        if: ${{ !cancelled() }}
        uses: actions/github-script@v9
        with:
          script: |
            const scriptPath = `${process.env.GITHUB_WORKSPACE}/.github/scripts/wasm_stdlib.js`;
            const script = require(scriptPath);
            return script({ github, context, core });

  sanitize:
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.changes.outputs.native == 'true') }}
    uses: ./.github/workflows/sanitize.yml

  build:
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.changes.outputs.native == 'true') }}
    uses: ./.github/workflows/build.yml

  check-wasm-stdlib:
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.changes.outputs.native == 'true') }}
    uses: ./.github/workflows/wasm_stdlib.yml

  native-ci:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (always()) }}
    needs: [changes, checks, sanitize, build, check-wasm-stdlib]
    runs-on: ubuntu-latest
    steps:
      - name: Check native CI results
        env:
          CHANGES: ${{ needs.changes.result }}
          NATIVE: ${{ needs.changes.outputs.native }}
          CHECKS: ${{ needs.checks.result }}
          SANITIZE: ${{ needs.sanitize.result }}
          BUILD: ${{ needs.build.result }}
          WASM_STDLIB: ${{ needs.check-wasm-stdlib.result }}
        run: |
          [[ "$CHANGES" == success ]] || exit 1
          case "$NATIVE" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) echo '::error::Native CI filter output must be true or false'; exit 1 ;;
          esac
          for job in "checks:$CHECKS" "sanitize:$SANITIZE" "build:$BUILD" "check-wasm-stdlib:$WASM_STDLIB"; do
            result=${job#*:}
            if [[ "$result" != "$expected" ]]; then
              echo "::error::${job%%:*} returned '$result'; expected '$expected' for native=$NATIVE"
              exit 1
            fi
          done

  bindgen:
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.bindgen == 'true') }}
    uses: ./.github/workflows/bindgen.yml

  wasm-exports:
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.wasm-exports == 'true') }}
    uses: ./.github/workflows/wasm_exports.yml

  package-types:
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.package-types == 'true') }}
    uses: ./.github/workflows/package-types.yml

  highlight-compat:
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.highlight-compat == 'true') }}
    uses: ./.github/workflows/highlight-compat.yml

  gate:
    name: Complete CI gate
    if: always()
    needs: [changes, checks, consistency, sanitize, build, check-wasm-stdlib, native-ci, bindgen, wasm-exports, package-types, highlight-compat]
    runs-on: ubuntu-latest
    steps:
      - name: Require a ready PR
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          echo '::error::Mark this PR ready for review to run the required checks.'
          exit 1
      - name: Reject failed or cancelled CI jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
